name: Acquire verified Ghidra runtime
on:
  push:
    branches:
      - tooling/ghidra-runtime

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Ghidra 11.0.3
        run: |
          curl --fail --location --retry 3 \
            --output ghidra_11.0.3_PUBLIC_20240410.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.3_build/ghidra_11.0.3_PUBLIC_20240410.zip
          echo "2462a2d0ab11e30f9e907cd3b4aa6b48dd2642f325617e3d922c28e752be6761  ghidra_11.0.3_PUBLIC_20240410.zip" | sha256sum --check
      - name: Preserve verified runtime
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-11.0.3-verified
          path: ghidra_11.0.3_PUBLIC_20240410.zip
          retention-days: 1
          compression-level: 0
